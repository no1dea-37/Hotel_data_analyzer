name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
      - name: Verify packaged app
        shell: bash
        run: |
          npx --yes @electron/asar extract dist/win-unpacked/resources/app.asar asar_out
          echo "APP_VERSION=$(node -p "require('./asar_out/package.json').version")" | tee verify.txt
          grep -q "房间已满" asar_out/hotel-pricing-dashboard.html && echo "FULL_ROOM_MSG=ok" | tee -a verify.txt || echo "FULL_ROOM_MSG=missing" | tee -a verify.txt
          grep -q "Company_name" asar_out/hotel-pricing-dashboard.html && echo "PRIVATE_KIND=placeholder" | tee -a verify.txt || echo "PRIVATE_KIND=real_name" | tee -a verify.txt
          test -f asar_out/xlsx.full.min.js && echo "SHEETJS=ok" | tee -a verify.txt || { echo "SHEETJS=missing" | tee -a verify.txt; exit 1; }
          grep -q 'tables-grid' asar_out/hotel-pricing-dashboard.html && echo "ARRIVALS_TABLE=ok" | tee -a verify.txt || { echo "ARRIVALS_TABLE=missing" | tee -a verify.txt; exit 1; }
          ls -l dist/*.exe | tee -a verify.txt
          sha256sum dist/*.exe | tee -a verify.txt
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hotel-pricing-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: verify.txt
          retention-days: 14
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" dist/*.exe --title "v$VERSION" --notes "自动构建 v$VERSION" || gh release upload "v$VERSION" dist/*.exe --clobber
