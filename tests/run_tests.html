<!doctype html><meta charset="utf-8">
<iframe id="f" src="../hotel-pricing-dashboard.html" style="width:1500px;height:1300px"></iframe>
<script>
const f=document.getElementById('f');
const $=(id)=>f.contentDocument.getElementById(id);
const rd=(id)=>$(id).textContent.replace(/\s+/g,' ').trim();
const HEAD='房号,房类,#,姓名,状态,-,-,-,-,次数,人数,到达,离开,房价码,房价,包价,余额,信用,团体,备注,手机,账号\n';
const rows=a=>HEAD+a.map(r=>r.join(',')).join('\n')+'\n';
const base=[['101','SNVK','1','Alice','I','','','0','1','0','1','26/07/26 16:07:33','26/07/28 12:00:00','PUB1','300','','0','0','///','无备注','100','ACC1'],
['102','SNVK','1','Bob','I','','','0','1','0','1','26/07/26 16:07:33','26/07/28 12:00:00','PUB2','500','','0','0','///','无备注','100','ACC2']];
const priv=[base[0],['102','SNVK','1','Bob','I','','','0','1','0','1','26/07/26 16:07:33','26/07/28 12:00:00','PUB2','500','','0','0','//Company_name','¥100*2','100','ACC2']];
const fut=[...base,['103','SNVK','1','Carol','I','','','0','1','0','1','26/07/30 16:07:33','26/08/01 12:00:00','PUB3','200','','0','0','///','无备注','100','ACC3']];
const out=[];
async function run(name,csv,date,rooms){
  const inp=$('fileInput');
  const dt=new DataTransfer();dt.items.add(new File([csv],'test.csv',{type:'text/csv'}));
  inp.files=dt.files;inp.dispatchEvent(new Event('change',{bubbles:true}));
  await new Promise(r=>setTimeout(r,250));
  $('dateInput').value=date;$('roomsInput').value=String(rooms);
  $('calcForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
  await new Promise(r=>setTimeout(r,80));
  out.push({name,revenue:rd('revenue'),occupied:rd('occupiedRooms'),vacant:rd('vacantRooms'),suggestion:rd('suggestion')});
}
f.onload=async()=>{
  try{
    await run('A 基础两间',rows(base),'2026-07-27',115);
    await run('B 私联¥100*2',rows(priv),'2026-07-27',115);
    await run('C 满房',rows(priv),'2026-07-27',2);
    await run('D 未来单跳过',rows(fut),'2026-07-27',115);
    await run('E 已离店',rows(base),'2026-07-29',115);
    document.body.innerHTML='<pre id="out">'+JSON.stringify(out,null,1)+'</pre>';
  }catch(e){document.body.innerHTML='<pre>ERR '+e.stack+'</pre>'}
};
</script>
